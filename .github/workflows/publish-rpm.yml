name: Publish RPM package

on:
  repository_dispatch:
    types: [package-published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "smfc release tag"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: write

    steps:
      - name: Install dependencies
        run: dnf install -y createrepo_c rpm-sign gnupg2 git gh

      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_SIGNING_GPG_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Configure RPM signing macros
        run: echo "%_gpg_name 9E06E863D50D7541" > ~/.rpmmacros

      - name: Resolve release tag
        id: tag
        run: echo "value=${{ github.event.client_payload.release_tag || inputs.release_tag }}" >> $GITHUB_OUTPUT

      - name: Download .rpm from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/in
          gh release download "${{ steps.tag.outputs.value }}" -R petersulyok/smfc -p '*.rpm' -D /tmp/in

      - name: Copy repository files from workflow commit
        run: |
          for f in smfc.repo smfc-el.repo smfc-repo.gpg; do
            git show "${{ github.sha }}:$f" > "$f"
          done

      - name: Sign packages
        run: rpm --addsign /tmp/in/*.rpm

      # Transition period: a new Fedora tree gets the earlier RPMs of its dist tag from the root tree.
      # Remove this step at the end of the transition.
      - name: Fill new Fedora trees from root tree
        run: |
          for rpm in /tmp/in/*.fc[0-9]*.noarch.rpm; do
            release=$(rpm -qp --qf '%{RELEASE}' "$rpm")
            dist=${release##*.}
            tree="fedora/${dist#fc}"
            if [ ! -d "$tree" ] && ls packages/*."$dist".noarch.rpm > /dev/null 2>&1; then
              mkdir -p "$tree"
              cp packages/*."$dist".noarch.rpm "$tree/"
            fi
          done

      - name: Add packages to their trees
        run: |
          : > /tmp/trees
          for rpm in /tmp/in/*.rpm; do
            release=$(rpm -qp --qf '%{RELEASE}' "$rpm")
            dist=${release##*.}
            case "$dist" in
              fc[0-9]*) tree="fedora/${dist#fc}" ;;
              el[0-9]*) tree="$dist" ;;
              *) echo "::error::Unknown dist tag '$dist' in $(basename "$rpm")"; exit 1 ;;
            esac
            mkdir -p "$tree"
            cp "$rpm" "$tree/"
            echo "$tree" >> /tmp/trees
          done
          for tree in $(sort -u /tmp/trees); do
            createrepo_c --update "$tree"
            gpg --batch --yes --detach-sign --armor "$tree/repodata/repomd.xml"
          done

      # Transition period: the root tree serves the old smfc.repo files with the newest Fedora RPM.
      # Remove this step at the end of the transition, and delete packages/ and repodata/ from gh-pages.
      - name: Update root tree for old smfc.repo files
        run: |
          newest=$(ls /tmp/in/*.fc[0-9]*.noarch.rpm | sort -V | tail -n 1)
          mkdir -p packages
          cp "$newest" packages/
          ls packages/*.rpm > /tmp/root-pkglist
          createrepo_c --update --pkglist /tmp/root-pkglist .
          gpg --batch --yes --detach-sign --armor repodata/repomd.xml

      - name: Commit and push gh-pages
        run: |
          git config user.name "smfc-bot"
          git config user.email "smfc-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish ${{ steps.tag.outputs.value }}"
          git push origin gh-pages